name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test --scratch-path /tmp/ClipDock-tests
      - name: Universal app build
        run: >-
          xcodebuild -project ClipDock.xcodeproj -scheme ClipDock
          -configuration Release -derivedDataPath build/Universal
          ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build
